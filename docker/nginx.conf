worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;
        root /app/static;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # Only acta's own scripts run; the two font services are the only outside origins, and only
        # for stylesheets and fonts. No inline script exists to allow, and nothing may frame the app.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com https://api.fontshare.com; font-src 'self' https://fonts.gstatic.com https://cdn.fontshare.com; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        # The backend's own default ceiling for a request body - text fields have no limit of their
        # own, so this is what bounds one card's notes.
        client_max_body_size 10m;

        location = /health {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # hashed filenames from the vite build - safe to cache forever
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
            # A location-level add_header drops the server-level ones - nosniff matters most here.
            add_header X-Content-Type-Options nosniff always;
        }

        # The service worker decides when every other file updates, so it must never be served
        # stale itself. A location-level add_header drops the server-level ones, hence the repeat.
        location = /sw.js {
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # SPA fallback for client-side routes
        location / {
            try_files $uri /index.html;
        }
    }
}
